spring:
  application:
    name: core-service

  #DB Config
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  #JPA (Hibernate) Config
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  #Liquibase Config
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  #GraphQL Config
  graphql:
    graphiql:
      enabled: false
    schema:
      printer:
        enabled: false

  #Virtual Threads enabled
  threads:
    virtual:
      enabled: true

  #Mail Config
  mail:
    host: smtp.resend.com
    port: 465
    username: resend
    password: ${RESEND_API_KEY}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

server:
  port: ${PORT:8080}
  shutdown: graceful

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expiration-time: ${JWT_EXPIRATION_MS}

app:
  base-url: ${APP_BASE_URL:http://localhost:4200}
  mail:
    from: ${MAIL_FROM:onboarding@resend.dev}
